services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpo
      POSTGRES_PASSWORD: corpo
      POSTGRES_DB: corpo_lingo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpo -d corpo_lingo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: this compose runs the full stack in DEVELOPMENT mode. NODE_ENV defaults
  # to development, so cookies are NOT Secure, the JWT startup guard is off, and DB
  # SSL is disabled — appropriate for local testing over http://localhost, not for
  # production. Do NOT just set NODE_ENV=production here: that turns on Secure
  # cookies (which a browser won't send over plain HTTP) and DB SSL (the local
  # postgres has no TLS). A real deployment needs HTTPS + an SSL-capable Postgres.
  # See docs/deployment.md.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}   # overridable: `NODE_ENV=production docker compose up` (see note above)
      DATABASE_URL: postgresql://corpo:corpo@postgres:5432/corpo_lingo
      REDIS_URL: redis://redis:6379
    env_file:
      - apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Public OAuth client ID, inlined into the bundle at build time.
        # Set it in the shell or a root .env: VITE_GOOGLE_CLIENT_ID=...
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
